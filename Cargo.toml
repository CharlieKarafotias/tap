[package]
name = "tap"
version = "1.0.0"
edition = "2024"
authors = ["Charlie Karafotias <cnkara2023@gmail.com>"]
repository = "https://github.com/CharlieKarafotias/tap"
description = "Tap is a CLI designed to quickly access links associated with a directory."

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
serde = { version = "1.0.229", features = ["derive"] }
surrealdb = { version = "3.2.4", features = ["kv-mem", "kv-surrealkv"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

